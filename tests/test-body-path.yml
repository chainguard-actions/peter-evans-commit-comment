name: Test commit comment with body-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create comment body file
        run: |
          echo "This is a test commit comment from a file." > /tmp/comment-body.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: peter-evans/commit-comment
          sha: abc1234567890abcdef1234567890abcdef12345
          body-path: /tmp/comment-body.txt
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with body-path"
